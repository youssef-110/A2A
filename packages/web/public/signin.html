<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to A2A</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
  <script>try { if (localStorage.getItem("a2a-theme") === "light") document.documentElement.dataset.theme = "light"; } catch {}</script>
</head>
<body>
  <main class="auth">
    <div class="auth-card">
      <a class="logo" href="/" aria-label="A2A home">
        <svg viewBox="0 0 50 28" fill="currentColor" aria-hidden="true"><rect class="link" x="17" y="18.6" width="16" height="4.6"/><path fill-rule="evenodd" d="M7 0h8l7 28h-6.4l-1.1-4.8H7.5L6.4 28H0Zm4 9.2-2.7 9.4h5.4Z"/><path fill-rule="evenodd" d="M35 0h8l7 28h-6.4l-1.1-4.8h-7L34.4 28H28Zm4 9.2-2.7 9.4h5.4Z"/></svg></a>
      <div>
        <h1 id="title">Welcome back</h1>
        <p class="sub" id="sub">Sign in to your sessions and agents.</p>
      </div>
      <div class="providers">
      <a class="google" id="google" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Continue with Google
      </a>
      <a class="google github" id="github" href="/auth/github">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.36-3.88-1.36-.52-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.78 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.83 1.19 3.09 0 4.42-2.7 5.39-5.26 5.68.41.36.78 1.06.78 2.14v3.17c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5Z"/></svg>
        Continue with GitHub
      </a>
      </div>
      <div class="divider">or with email</div>
      <form id="form" novalidate>
        <label class="field" id="name-field" hidden><span>Your name</span><input class="input" id="name" name="name" autocomplete="name" placeholder="Robin Vale" maxlength="60"></label>
        <label class="field"><span>Email</span><input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required></label>
        <label class="field"><span>Password</span><input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 10 characters" required minlength="10"></label>
        <a class="forgot" id="forgot" href="/forgot">Forgot password?</a>
        <label class="check" id="news-field" hidden><input type="checkbox" id="newsletter" checked> <span>Send me The Relay, a short monthly note on what's new</span></label>
        <p class="error" id="error" role="alert"></p>
        <button class="btn" type="submit" id="submit">Sign in</button>
      </form>
      <p class="switch" id="switch">New to A2A? <a href="/signup">Create an account</a></p>
    </div>
  </main>
  <script>
    (() => {
      const signup = location.pathname === "/signup";
      const params = new URLSearchParams(location.search);
      // Only same-site destinations: the dashboard, or the page that links a desktop app.
      const want = params.get("next") || "/app";
      const next = /^\/(app|link)(\/|\?|$)/.test(want) ? want : "/app";
      const $ = (id) => document.getElementById(id);
      const error = $("error");

      if (signup) {
        document.title = "Create your a2a account";
        $("title").textContent = "Create your account";
        $("sub").textContent = "Free while in beta. Your first workspace is ready as soon as you sign up.";
        $("name-field").hidden = false;
        $("news-field").hidden = false;
        $("forgot").hidden = true;
        $("password").autocomplete = "new-password";
        $("submit").textContent = "Create account";
        $("switch").innerHTML = 'Already have an account? <a href="/signin">Sign in</a>';
      }
      const q = new URLSearchParams({ next }).toString();
      $("switch").querySelector("a").href += `?${q}`;
      $("google").href = `/auth/google?${q}`;
      $("github").href = `/auth/github?${q}`;
      $("forgot").addEventListener("click", () => ($("forgot").href = `/forgot${$("email").value ? `?email=${encodeURIComponent($("email").value)}` : ""}`));

      const NAMES = { google: "Google", github: "GitHub" };
      const unavailable = (p) => `${NAMES[p]} sign-in isn't set up on this server yet. Use email for now.`;
      const off = (p) => {
        $(p).setAttribute("aria-disabled", "true");
        $(p).addEventListener("click", (e) => { e.preventDefault(); error.textContent = unavailable(p); });
      };
      const err = params.get("error");
      if (err === "google_unavailable" || err === "github_unavailable") error.textContent = unavailable(err.split("_")[0]);
      // Only the server's own short messages are shown, never a paragraph someone put in a link.
      else if (err && /^[\w .,'-]{1,90}$/.test(err) && /(sign-in|Google|GitHub|verified email)/.test(err)) error.textContent = err;

      // Ask the server once which sign-ins are configured, so a button never leads to a dead end.
      fetch("/auth/providers").then((r) => r.json()).then((s) => {
        for (const p of Object.keys(NAMES)) if (!s[p]) off(p);
      }).catch(() => {});

      $("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        error.textContent = "";
        const body = { email: $("email").value, password: $("password").value, ...(signup ? { name: $("name").value, newsletter: $("newsletter").checked } : {}) };
        if (!body.email || !body.password) return (error.textContent = "Enter your email and password.");
        $("submit").disabled = true;
        try {
          const res = await fetch(signup ? "/auth/signup" : "/auth/signin", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || "That didn’t go through. Check your connection and try again.");
          location.href = next;
        } catch (ex) {
          error.textContent = ex.message;
          $("submit").disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
