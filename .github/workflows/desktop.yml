# Builds the desktop app on the OS it is for: the Mac .dmg needs macOS, the Linux AppImage needs Linux.
# Run it from the Actions tab (or `gh workflow run desktop.yml`), then download the artifacts into
# desktop/dist and run `npm run publish-site` in desktop/ before `pnpm cloud:deploy`.
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac dmg --universal
            artifact: desktop-mac
            files: desktop/dist/*.dmg
          - os: ubuntu-latest
            target: --linux AppImage --x64
            artifact: desktop-linux
            files: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Build
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
